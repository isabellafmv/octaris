name: Release build

on:
  push:
    tags: ["*"]

jobs:
  build:
    name: Build the macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true # CuraEngine and other native binaries
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install PyInstaller
        run: pip install pyinstaller
      - name: Install client dependencies
        run: npm ci
        working-directory: client
      # Builds only. To publish the GitHub release electron-updater reads,
      # pass --publish always and set GH_TOKEN (with contents: write).
      - name: Build
        run: ./build.sh --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: octaris-${{ github.ref_name }}
          path: |
            client/dist/*.dmg
            client/dist/*.zip
          if-no-files-found: error

  build-windows:
    name: Build the Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true # resources/bin/windows/CuraEngine.exe
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install PyInstaller
        run: pip install pyinstaller
      - name: Install client dependencies
        run: npm ci
        working-directory: client
      - name: Backend tests
        run: |
          pip install -e ".[dev]"
          pytest -q
        working-directory: backend
      # Fails with a clear message until CuraEngine.exe is committed (see README)
      - name: Build
        run: python build.py --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: octaris-${{ github.ref_name }}-windows
          path: client/dist/*.exe
          if-no-files-found: error
