[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "octaris-backend"
version = "0.1.0"
description = "Octaris 6-axis bioprinter control backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pyserial>=3.5",
    "python-multipart>=0.0.9",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyserial",
    "pre-commit>=3.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.ruff]
line-length = 110
target-version = "py310"
# blob-detection.py: a standalone OpenCV experiment, not part of the app
extend-exclude = ["build", "dist", "backend/blob-detection.py"]

[tool.ruff.lint]
# pyflakes, pycodestyle, isort, bugbear, pyupgrade, simplify, async
select = ["F", "E", "W", "I", "B", "UP", "SIM", "ASYNC"]
ignore = [
    "SIM105",  # contextlib.suppress over try/except/pass: a matter of taste
    "SIM108",  # ternaries over if/else blocks: same
]

[tool.ruff.lint.per-file-ignores]
# Blocking file reads and polling loops are fine in tests
"tests/**" = ["ASYNC110", "ASYNC240"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are meant to be called in defaults
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Form"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "tests"]

[tool.mypy]
python_version = "3.10"
packages = ["backend"]
exclude = ["blob-detection\\.py$"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["uvicorn.*"]
ignore_missing_imports = true
