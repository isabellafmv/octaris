appId: com.octaris.bioprinter
productName: Octaris
icon: resources/icon.png

directories:
  buildResources: build

files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'

extraResources:
  # PyInstaller-built backend (the whole folder)
  - from: "../backend/dist/octaris-backend"
    to: "backend/octaris-backend"
    filter:
      - "**/*"

asarUnpack:
  - resources/**

mac:
  identity: null              # skip code signing (run xattr -cr on the .app to open)
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's camera for vision calibration.
  notarize: false

dmg:
  artifactName: Octaris-${version}-mac.${ext}

npmRebuild: false

publish:
  provider: github
  owner: isabellamv        # ← update to your GitHub username
  repo: octaris            # ← update to your repo name
  releaseType: release
