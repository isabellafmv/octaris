appId: com.octaris.bioprinter
productName: Octaris
icon: resources/icon.png

directories:
  buildResources: build

files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'

extraResources:
  # PyInstaller-built backend (the whole folder)
  - from: "../backend/dist/octaris-backend"
    to: "backend/octaris-backend"
    filter:
      - "**/*"

asarUnpack:
  - resources/**

mac:
  # Signed with the "Developer ID Application" certificate in the login
  # keychain (electron-builder finds it; set CSC_NAME to pick one, e.g. the
  # SHA-1 hash `security find-identity -v -p codesigning` prints). Build with
  # build.py, not `npm run build:mac` directly: build.py signs the backend
  # first (see signIgnore), notarizes and staples the .dmg and checks the
  # result. `build.py --unsigned` builds an ad-hoc signed app for local tests.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  # build.py has already signed the PyInstaller backend and CuraEngine with
  # their own (smaller) entitlements; don't re-sign them with Electron's
  signIgnore:
    - /Contents/Resources/backend/
  # Uses APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID from the
  # environment; skipped (with a warning) when they aren't set
  notarize: true
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's camera for vision calibration.

dmg:
  artifactName: Octaris-${version}-mac.${ext}

win:
  # Unsigned for now: SmartScreen warns on first run ("Windows protected your
  # PC" → More info → Run anyway). Signing needs a code-signing certificate.
  target:
    - target: nsis
      arch:
        - x64

nsis:
  artifactName: Octaris-${version}-win-setup.${ext}

npmRebuild: false

publish:
  provider: github
  owner: isabellamv        # ← update to your GitHub username
  repo: octaris            # ← update to your repo name
  releaseType: release
